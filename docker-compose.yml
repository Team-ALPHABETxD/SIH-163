services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vulnweave
      POSTGRES_USER: vulnweave
      POSTGRES_PASSWORD: vulnweave
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnweave -d vulnweave"]
      interval: 5s
      timeout: 3s
      retries: 10

  demo-target:
    build: ./DemoTarget
    ports:
      - "9000:9000"
    networks:
      - sentinel

  backend:
    build: ./Backend
    environment:
      DATABASE_URL: postgresql+psycopg://vulnweave:vulnweave@postgres:5432/vulnweave
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080
      DEFAULT_TARGET_NAME: Local VulnWeave Attack Lab
      DEFAULT_TARGET_URL: http://demo-target:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      demo-target:
        condition: service_started
    networks:
      - sentinel

  frontend:
    build: ./Frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - sentinel

volumes:
  postgres_data:

networks:
  sentinel:
    driver: bridge